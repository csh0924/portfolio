<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Emuda System Architecture</title>
  <desc id="desc">iOS WebView, Spring Boot 서버, 데이터베이스, BERT 서버, ChatGPT와 Spotify API 및 배포 환경의 관계</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24344d" stroke-opacity=".18"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77ddd1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#121d2f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="90" y="82" fill="#77ddd1" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3">EMUDA / SYSTEM ARCHITECTURE</text>
  <text x="90" y="145" fill="#f5f6f2" font-family="Manrope, sans-serif" font-size="48" font-weight="700">Backend &amp; External Services</text>
  <text x="1510" y="82" fill="#7f8ca0" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15">CASE 01 · 2024</text>

  <g font-family="Manrope, Noto Sans KR, sans-serif">
    <g transform="translate(90 330)">
      <rect width="230" height="190" rx="4" fill="#f5f6f2"/>
      <text x="28" y="42" fill="#1c55ff" font-family="IBM Plex Mono, monospace" font-size="13">CLIENT</text>
      <text x="28" y="100" fill="#121d2f" font-size="27" font-weight="700">iOS WebView</text>
      <text x="28" y="142" fill="#5c6878" font-size="15">React Web UI</text>
      <text x="28" y="169" fill="#5c6878" font-size="15">REST Request / Response</text>
    </g>

    <g transform="translate(440 250)">
      <rect width="390" height="350" rx="4" fill="#1c55ff"/>
      <text x="32" y="46" fill="#d7e1ff" font-family="IBM Plex Mono, monospace" font-size="13">APPLICATION SERVER / AWS EC2</text>
      <text x="32" y="106" fill="#fff" font-size="32" font-weight="700">Spring Boot API</text>
      <g font-size="16">
        <rect x="32" y="146" width="150" height="58" rx="2" fill="#1748d6"/>
        <text x="49" y="181" fill="#fff">Member / Auth</text>
        <rect x="204" y="146" width="150" height="58" rx="2" fill="#1748d6"/>
        <text x="228" y="181" fill="#fff">Diary API</text>
        <rect x="32" y="224" width="150" height="58" rx="2" fill="#1748d6"/>
        <text x="45" y="259" fill="#fff">Playlist Service</text>
        <rect x="204" y="224" width="150" height="58" rx="2" fill="#1748d6"/>
        <text x="223" y="259" fill="#fff">AI Orchestration</text>
      </g>
      <text x="32" y="323" fill="#d7e1ff" font-size="14">DTO · Validation · Response Assembly</text>
    </g>

    <g transform="translate(970 210)">
      <rect width="245" height="145" rx="4" fill="#f5f6f2"/>
      <text x="24" y="37" fill="#1c55ff" font-family="IBM Plex Mono, monospace" font-size="13">MODEL SERVER / GCP</text>
      <text x="24" y="84" fill="#121d2f" font-size="24" font-weight="700">Flask · BERT</text>
      <text x="24" y="116" fill="#5c6878" font-size="14">Emotion Analysis API</text>
    </g>
    <g transform="translate(970 395)">
      <rect width="245" height="145" rx="4" fill="#192a43" stroke="#77ddd1"/>
      <text x="24" y="37" fill="#77ddd1" font-family="IBM Plex Mono, monospace" font-size="13">EXTERNAL LLM</text>
      <text x="24" y="84" fill="#f5f6f2" font-size="24" font-weight="700">ChatGPT API</text>
      <text x="24" y="116" fill="#a9b3c1" font-size="14">Music Recommendation</text>
    </g>
    <g transform="translate(970 580)">
      <rect width="245" height="145" rx="4" fill="#192a43" stroke="#77ddd1"/>
      <text x="24" y="37" fill="#77ddd1" font-family="IBM Plex Mono, monospace" font-size="13">EXTERNAL MUSIC API</text>
      <text x="24" y="84" fill="#f5f6f2" font-size="24" font-weight="700">Spotify API</text>
      <text x="24" y="116" fill="#a9b3c1" font-size="14">Track Metadata Search</text>
    </g>
    <g transform="translate(1300 330)">
      <ellipse cx="110" cy="24" rx="110" ry="24" fill="#f5f6f2"/>
      <rect y="24" width="220" height="150" fill="#f5f6f2"/>
      <ellipse cx="110" cy="174" rx="110" ry="24" fill="#dfe2e7"/>
      <text x="110" y="88" fill="#1c55ff" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13">DATABASE</text>
      <text x="110" y="129" fill="#121d2f" text-anchor="middle" font-size="27" font-weight="700">MySQL</text>
    </g>
  </g>

  <g fill="none" stroke="#77ddd1" stroke-width="3" marker-end="url(#arrow)">
    <path d="M320 425H430"/>
    <path d="M830 318H960"/>
    <path d="M830 450H960"/>
    <path d="M830 530C900 530 890 652 960 652"/>
    <path d="M830 385C1040 385 1045 425 1290 425"/>
  </g>
  <g fill="#7f8ca0" font-family="IBM Plex Mono, monospace" font-size="13">
    <text x="346" y="410">REST / JSON</text>
    <text x="852" y="302">HTTP</text>
    <text x="852" y="436">HTTPS</text>
    <text x="857" y="624">HTTPS</text>
    <text x="1110" y="404">JPA</text>
  </g>

  <g transform="translate(90 680)">
    <rect width="740" height="105" rx="3" fill="#0d1626" stroke="#34435a"/>
    <text x="26" y="34" fill="#77ddd1" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="2">MY SCOPE</text>
    <text x="26" y="72" fill="#dce1e8" font-family="Manrope, Noto Sans KR, sans-serif" font-size="16">Spring REST API · DTO 설계 · AI/API 연동 · 데이터 저장 · EC2 배포 및 로그 관리</text>
  </g>
  <text x="1510" y="842" fill="#7f8ca0" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13">CHOI SE HOON · PORTFOLIO</text>
</svg>
